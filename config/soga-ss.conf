# 基础配置
type=xboard
server_type=ss
node_id=n
soga_key=

# webapi 或 db 对接任选一个
api=webapi

# webapi 对接信息
webapi_url=
webapi_key=

# db 对接信息
db_host=
db_port=
db_name=
db_user=
db_password=

# dns 配置
#default_dns=1.1.1.1,8.8.8.8,2606:4700::1111,2001:4860:4860::8888 # 留空则用 /etc/resolv.conf 里的服务器
#dns_cache_time=1             # 分钟
dns_strategy=ipv4_first      # ipv4_first(默认) / ipv6_first / ipv4_only / ipv6_only

# 日志文件夹，建议不要修改
log_file_dir=/etc/soga/ss/

# 用户 ip 缓存文件夹，建议不要修改
ip_user_cache_save_dir=/etc/soga/ss/

# 更多配置项请看文档根据需求自行添加
