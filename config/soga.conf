# 基础配置
type=xboard
server_type=ss
node_id=n
soga_key=

# webapi 或 db 对接任选一个
api=webapi

# webapi 对接信息
webapi_url=
webapi_key=

# db 对接信息
db_host=
db_port=
db_name=
db_user=
db_password=

# 手动证书配置
cert_file=
key_file=

# 自动证书配置
cert_mode=
cert_domain=
cert_key_length=ec-256
dns_provider=

# dns 配置
default_dns=1.1.1.1,8.8.8.8,2606:4700::1111,2001:4860:4860::8888 # 留空则用 /etc/resolv.conf 里的服务器
dns_cache_time=1             # 分钟
dns_strategy=ipv4_first      # ipv4_first(默认) / ipv6_first / ipv4_only / ipv6_only

# proxy protocol 中转配置
proxy_protocol=false
udp_proxy_protocol=false

# 全局限制用户 IP 数配置
redis_enable=false
redis_addr=
redis_password=
redis_db=0
conn_limit_expiry=60

# 动态限速配置
dy_limit_enable=false
dy_limit_duration=
dy_limit_trigger_time=60
dy_limit_trigger_speed=100
dy_limit_speed=30
dy_limit_time=600
dy_limit_white_user_id=

# ==== 同步 / 上报 ====
check_interval=60
submit_interval=60
# random_interval_range=10   # 2.13.5+ 给上面两个间隔加随机抖动，削减面板压力
submit_real_ip=false

# ==== 杂项 ====
user_conn_limit=0            # v2board 必填项
user_speed_limit=0
node_speed_limit=0
forbidden_bit_torrent=true
log_level=info

# 更多配置项请看文档根据需求自行添加
